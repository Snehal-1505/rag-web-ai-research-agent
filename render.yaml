services:
  - type: web
    name: rag-web-ai-research-agent
    env: python
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install torch --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: python startup.py && python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
    disk:
      name: rag-persistent-data
      mountPath: /var/data
      sizeGB: 1
